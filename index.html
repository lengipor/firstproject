<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BNMC Landing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="./assets/src/css/index.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#" class="navbar-brand">BNMC</a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <i class="bi bi-list"></i>
            </button>
            <ul class="navbar-nav">
                <li><a href="#home" class="nav-link">Home</a></li>
                <li><a href="#about" class="nav-link">About Us</a></li>
                <li><a href="#service" class="nav-link">Service</a></li>
                <li><a href="#advantage" class="nav-link">Advantage</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="btn-group">
                <button class="mode-toggle" id="themeToggle">
                    <i class="bi bi-circle-half"></i>
                    <span>Auto</span>
                </button>
                <button class="mode-toggle" onclick="Login_Item()">ចូលគណនី</button>
                <button class="mode-toggle" onclick="SignsIn_()">ចុះឈ្មោះ</button>
            </div>
            <!-- <h1>V</h1> -->
            <ul class="navbar-nav-2" id="mobile-menu">
                <div style="padding: 0px 0px 5px 0 ;">
                    <h1>Business national monistry </h1>
                <p>Cambodia <span>⭐</span></p>
                </div>
                <hr style="margin: 1rem auto; display:flex; width:100%; height: 1px;">
                <!-- <hr> -->
                <li><a href="#home" class="nav-link">Home</a></li>
                <li><a href="#about" class="nav-link">About Us</a></li>
                <li><a href="#service" class="nav-link">Service</a></li>
                <li><a href="#advantage" class="nav-link">Advantage</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
                <hr style="margin: 2rem auto; display:flex; width:100%; height: 1px;">
                <li>
                    <button class="mode-toggle mobile-mode-toggle" id="mobileThemeToggle">
                        <i class="bi bi-circle-half"></i>
                        <span></span>
                    </button>
                </li>
                <li><button class="mode-toggle nav-link"  onclick="Login_Item()">ចូលគណនី</button></li>
                <li><button class="mode-toggle nav-link" onclick="SignsIn_()">ចុះឈ្មោះ</button></li>
            </ul>
        </div>
    </nav>
    <main class="banner">
        <section class="sec1" id="home">
            <h1>Homepage</h1>
        </section>
        <section class="sec1" id="about">
            <h1>Aboutpage</h1>
        </section>
        <section class="sec1" id="service">
            <h1>Service on page</h1>
        </section>
        <section class="sec1" id="advantage">
            <h1>Advantage on page</h1>
        </section>
        <section class="sec1" id="contact">
            <h1>Contact on page</h1>
        </section>
    </main>
    <footer>
        <h1>Footer</h1>
    </footer>
    <script >
        // Select the theme toggle buttons
const themeToggles = document.querySelectorAll("#themeToggle, #mobileThemeToggle");
// Define the available theme options
const themeOptions = ["auto", "light", "dark"];
let currentThemeIndex = 0; // Track current theme index for cycling

// Apply the selected theme
function applyTheme(theme) {
    themeToggles.forEach((toggle) => {
        const icon = toggle.querySelector("i");
        const label = toggle.querySelector("span");

        if (theme === "auto") {
            const hour = new Date().getHours();
            const isNight = hour >= 18 || hour < 6;
            document.documentElement.setAttribute("data-theme", isNight ? "dark" : "light");
            icon.className = "bi bi-circle-half";
            label.textContent = "ស្វ័យប្រវត្តិ";
        } else if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            icon.className = "bi bi-moon-stars";
            label.textContent = "ពេលយប់";
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            icon.className = "bi bi-sun-fill";
            label.textContent = "ពេលថ្ងៃ";
        }
    });
}

// Load the saved theme from localStorage
function loadTheme() {
    const saved = localStorage.getItem("theme-mode") || "auto";
    currentThemeIndex = themeOptions.indexOf(saved);
    applyTheme(saved);
}

// Set up click event to cycle through themes
themeToggles.forEach((toggle) => {
    toggle.addEventListener("click", () => {
        currentThemeIndex = (currentThemeIndex + 1) % themeOptions.length;
        const newTheme = themeOptions[currentThemeIndex];
        applyTheme(newTheme);
        localStorage.setItem("theme-mode", newTheme); // Save choice
    });
});

// Automatically update theme if system preference changes (only in auto mode)
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
prefersDark.addEventListener("change", () => {
    if (localStorage.getItem("theme-mode") === "auto") {
        applyTheme("auto");
    }
});

// Apply theme on initial load
loadTheme();

// ================= Scrollspy ==================

// Get all sections and navigation links
const sections = document.querySelectorAll("section");
const navLinks = document.querySelectorAll(".nav-link");

// Highlight the nav link corresponding to the current scroll position
function onScroll() {
    let current = "";
    sections.forEach((section) => {
        const sectionTop = section.offsetTop - 110; // Offset for fixed header
        if (window.scrollY >= sectionTop) {
            current = section.getAttribute("id");
        }
    });

    navLinks.forEach((link) => {
        link.classList.remove("active");
        if (link.getAttribute("href") === "#" + current) {
            link.classList.add("active");
        }
    });
}

// Set scrollspy behavior on scroll and page load
window.addEventListener("scroll", onScroll);
window.addEventListener("load", onScroll);

// ============= Hamburger Menu for Mobile ==============

// Get hamburger button and mobile menu
const hamburger = document.getElementById("hamburger");
const mobileMenu = document.getElementById("mobile-menu");

// Toggle the mobile menu visibility on hamburger click
hamburger.addEventListener("click", () => {
    mobileMenu.classList.toggle("active");
    hamburger.setAttribute("aria-expanded", mobileMenu.classList.contains("active"));
    hamburger.querySelector("i").className = mobileMenu.classList.contains("active")
        ? "bi bi-x"
        : "bi bi-list";
});

// Close mobile menu when clicking a nav link or theme toggle
document
    .querySelectorAll(".navbar-nav-2 .nav-link, .navbar-nav-2 .mobile-mode-toggle")
    .forEach((item) => {
        item.addEventListener("click", () => {
            mobileMenu.classList.remove("active");
            hamburger.setAttribute("aria-expanded", "false");
            hamburger.querySelector("i").className = "bi bi-list";
        });
    });

// Close mobile menu when clicking outside of it
document.addEventListener("click", (e) => {
    if (!mobileMenu.contains(e.target) && !hamburger.contains(e.target)) {
        mobileMenu.classList.remove("active");
        hamburger.setAttribute("aria-expanded", "false");
        hamburger.querySelector("i").className = "bi bi-list";
    }
});

// ========== Placeholder Navigation Functions ==========

// Navigate to login page
function Login_Item() {
    window.location.href = "assets/bin/page_login/login.html";
}

// Navigate to signup page
function SignsIn_() {
    window.location.href = "assets/bin/signup.html";
}
    </script>
</body>
</html>
